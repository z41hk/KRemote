[package]
name = "rust_lib_kremote"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
tokio = { version = "1.41", features = ["full"] }
ssh2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
roxmltree = "0.20"
url = "2.5"
keyring = "2.3"

# RDP support via IronRDP (v0.17.0 - latest as of 2026)
ironrdp = { version = "0.17", features = ["connector", "session", "graphics", "input", "pdu"] }
ironrdp-blocking = "0.10"
rustls = "0.23"
tokio-rustls = "0.26"
x509-cert = { version = "0.2", features = ["std"] }
sspi = { version = "0.21", features = ["network_client"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
